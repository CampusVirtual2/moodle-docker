<!doctype html>
<html lang='pt-br'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title></title>
  <link rel="icon" href="data:,">
  <style>
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,table, caption, tbody, tfoot, thead, tr, th, td,article, aside, canvas, details, embed,figure, figcaption, footer, header, hgroup,menu, nav, output, ruby, section, summary,time, mark, audio, video {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
    }
    :root {
      --videoWidth: 10px;
      --marginLeft: calc((100vw - var(--videoWidth))/2);
      background-color:#000;
    }
    video{
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      margin: 10px auto;
      display:block;
    }
    #title {
      font-family: Arial, Helvetica, sans-serif;
      position: absolute;
      margin-left: var(--marginLeft);
      padding:3vw 0 0 3vw;
      width: calc(var(--videoWidth) - 3vw);
      height:30vh;
      background: linear-gradient(to top, transparent 0%, #fff 100%);
      display:flex;
      flex-flow:row;
    }
    #title h1{
      font-size: max(10px,calc(0.8vw));
      line-height: calc(1vw);
      color:#2b8834;
    }
    #title h2{
      font-size: max(16px,calc(12px + 1vw));
      line-height: calc(12px + 2.2vw);
      font-weight: 100;
      color: #333;
    }
    .title{
      flex-flow:column;
    }
    .svg-container{
      width: calc(3.9383125 * calc(12px + 2.6vw));
      margin-right: 1.5vw;
    }
    .modulo{
      text-transform: uppercase;
      color:#005f2b;
    }
    .bold{
      font-weight: bold;
    }
    .aula{
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id='title'>
    <div class='svg-container'>
      <svg id='svg2' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 315.07 80'></svg>
    </div>
    <div class='title'>
      <h2></h2>
    </div>
  </div>
  <video id='video' controls='' preload='metadata'>
    <source id='mp4' src='08-operadores.mp4' type='video/mp4'>
    <p>Seu navegador não suporta esse vídeo.</p>
  </video>
  <script>
    const video = document.querySelector('video');
    var root = document.querySelector(':root');
    video.onplay = (event) => {
      document.getElementById('title').style.display = 'none';
    };
    video.onpause = (event) => {
      document.getElementById('title').style.display = 'flex';
    };
    window.onresize = window.onload = function () {
      root.style.setProperty('--videoWidth', video.offsetWidth+'px');
    }
    video.addEventListener('loadedmetadata', function (e) {
      root.style.setProperty('--videoWidth', video.offsetWidth +'px');
    }, false);
  </script>
</body>
</html>
