<VirtualHost *:80>
    ServerAdmin webmaster@campusvirtual.unb.br
    ServerName www.campusvirtual.unb.br
    ServerAlias campusvirtual.unb.br

    DocumentRoot /var/www/html
    ErrorLog  /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined

    # ← USA 127.0.0.1:9000 (sempre funciona, sem DNS)
    ProxyPassMatch ^/(.*\.php(/.*)?)$ "http://127.0.0.1:9000/var/www/html/$1"
    ProxyPass / http://127.0.0.1:9000/
    ProxyPassReverse / http://127.0.0.1:9000/

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ServerName localhost
</VirtualHost>
