; ==========================================
; PHP tuning — Moodle (10 vCPU / 32 GB RAM)
; ==========================================

; === Recursos principais ===
memory_limit = 512M          ; cada worker PHP → ~512 MB máx
max_execution_time = 90
max_input_time = 60
max_input_vars = 5000

upload_max_filesize = 200M
post_max_size = 220M
upload_tmp_dir = /tmp/moodle_temp

; === Sessões via Redis (reduz carga no Postgres) ===
session.save_handler = redis
session.save_path = "tcp://redis:6379"
session.gc_maxlifetime = 14400

; === OpCache ===
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512      ; dobro do anterior
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 10
opcache.max_wasted_percentage = 5
opcache.fast_shutdown = 1

; === APCu (cache de variáveis PHP) ===
apc.enabled = 1
apc.shm_size = 256M
apc.enable_cli = 0

; === Logs ===
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

