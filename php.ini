; ============================
; PHP – Moodle (produção)
; ============================

; --- Recursos ---
memory_limit = 512M
max_execution_time = 120
max_input_time = 300
max_input_vars = 10000

; Uploads grandes (combine com Nginx/proxy)
upload_max_filesize = 2G
post_max_size       = 2G
upload_tmp_dir = /var/www/moodledata/temp
sys_temp_dir  = /var/www/moodledata/temp

; --- OPcache (produção “congelado”) ---
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.enable_file_override=1
opcache.max_wasted_percentage=5
; JIT costuma não ajudar no Moodle
opcache.jit=0
opcache.jit_buffer_size=0

; --- Realpath cache (FS) ---
realpath_cache_size=4096k
realpath_cache_ttl=600

; --- Sessões (deixe o Moodle controlar via config.php) ---
; REMOVER estas linhas do php.ini para evitar conflito:
; session.save_handler = redis
; session.save_path    = "tcp://172.16.28.204:6379"
session.gc_maxlifetime = 14400

; --- APCu (rcache) ---
apc.enabled = 1
apc.shm_size = 64M
apc.enable_cli = 0

; --- Logs / segurança ---
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
expose_php = 0
date.timezone = America/Sao_Paulo

cgi.fix_pathinfo = 0


