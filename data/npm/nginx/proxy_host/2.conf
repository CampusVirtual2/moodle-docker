# ------------------------------------------------------------
# cdn.campusvirtual.unb.br
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "campusvirtual.unb.br_cdn";
  set $port           80;

  listen 80;
listen [::]:80;

listen 443 ssl;
listen [::]:443 ssl;


  server_name cdn.campusvirtual.unb.br;

  http2 on;


  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-12/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-12/privkey.pem;












    # Force SSL
    include conf.d/include/force-ssl.conf;




proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-2_access.log proxy;
  error_log /data/logs/proxy-host-2_error.log warn;

#######################################
# 🔧 Cloudflare: IP real do visitante
#######################################
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

#######################################
# 🔐 Cabeçalhos de segurança para conteúdo embutido
#######################################
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Content-Security-Policy "
  default-src 'self';
  frame-ancestors https://campusvirtual.unb.br;
" always;

#######################################
# 🚫 Bloqueio de arquivos sensíveis (se aplicável no CDN)
#######################################

error_page 403 /custom_403.html;

location = /custom_403.html {
    internal;
    add_header X-Content-Type-Options "nosniff" always;
    return 403;
}

location ~* ^/(composer\.json|composer\.lock|Gruntfile\.js|npm-shrinkwrap\.json|behat\.yml\.dist)$ {
    deny all;
    return 403;
}

location ~* \.(env|log|md|sh|bat|ini|bak)$ {
    deny all;
    return 403;
}






  location / {









    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
