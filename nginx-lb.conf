worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Conexões/keepalive
    keepalive_timeout 65;
    keepalive_requests 10000;
    sendfile on; tcp_nopush on; tcp_nodelay on;

    # Uploads (combine com PHP: 2G)
    client_max_body_size 2g;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    gzip_types
        text/plain
	text/css
    	text/javascript
    	application/javascript
    	application/x-javascript
    	application/json
    	application/xml
    	application/rss+xml
    	application/vnd.ms-fontobject
    	font/ttf
    	font/otf
    	font/woff
    	font/woff2
    	image/svg+xml;


    upstream moodle_fpm {
        least_conn;
        server campusvirtual.unb.br_fpm01:9000;
        server campusvirtual.unb.br_fpm02:9000;
        server campusvirtual.unb.br_fpm03:9000;
        server campusvirtual.unb.br_fpm04:9000;
        server campusvirtual.unb.br_fpm05:9000;
        server campusvirtual.unb.br_fpm06:9000;
        server campusvirtual.unb.br_fpm07:9000;
        server campusvirtual.unb.br_fpm08:9000;

    }

    server {
        listen 80;
	#listen 9000;
        server_name campusvirtual.unb.br www.campusvirtual.unb.br;

        root /var/www/html;
        index index.php;

	add_header Access-Control-Allow-Origin *;
        # Não propague cabeçalhos de proxy aqui — eles vêm do NPM
        # estes podem até ser removidos
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # --- Cabeçalhos para TODAS as requisições ---
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
	#	proxy_set_header X-Forwarded-Scheme https;

        location / {
            try_files $uri/ /index.php?$query_string;
        }

	location ~ pluginfile\.php {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
    	    include fastcgi_params;
	    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
	    fastcgi_param PATH_INFO       $fastcgi_path_info;
	    fastcgi_pass moodle_fpm;
	}	

	location ~ (font\.php|theme\/font\.php) {
	    include fastcgi_params;
	    fastcgi_split_path_info ^(.+\.php)(/.+)$;
	    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
	    fastcgi_param PATH_INFO $fastcgi_path_info;
	    fastcgi_pass moodle_fpm;
	}

	location ~ ^/lib/javascript\.php {
   	    fastcgi_split_path_info ^(.+\.php)(/.+)$;
	    include fastcgi_params;
	    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
	    fastcgi_param PATH_INFO $fastcgi_path_info;
	    fastcgi_pass moodle_fpm;
	}

	location ~* \.(?:png|svg|jpg|jpeg|gif|webp|ico|css)$ {
 	    try_files $uri @fallback; 
	    access_log off;
	    expires 30d;
	}

	location @fallback {
 	    return 404;
	}	
		
	location ~ \.php(/|$) {
	#location ~ [^/]\.php(/|$) {
            fastcgi_index index.php;
	    include fastcgi_params;
	    #try_files $uri =404;
	    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
	    fastcgi_pass moodle_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	    fastcgi_param PATH_INFO $fastcgi_path_info;
	    #fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
	    # FORCE https dentro do PHP
	    fastcgi_param HTTP_X_FORWARDED_SCHEME https;
	    fastcgi_param HTTPS on;
	    fastcgi_param REQUEST_SCHEME https;
	    fastcgi_param X-Forwarded-Proto https;
	    fastcgi_param HTTP_X_FORWARDED_PROTO https;
	    fastcgi_param SERVER_PORT 443;

            fastcgi_keep_conn on;
	    fastcgi_connect_timeout 15s;
	    fastcgi_read_timeout    300s;
	    fastcgi_send_timeout    300s;
	    fastcgi_buffering on;
	    fastcgi_buffers 16 16k;
	    fastcgi_buffer_size 32k;
        }
    }
}

