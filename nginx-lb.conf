worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    charset                utf-8;
    sendfile               on;
    tcp_nopush             on;
    tcp_nodelay            on;
    server_tokens          off;
    log_not_found          off;
    types_hash_max_size    2048;
    types_hash_bucket_size 64;
    #client_max_body_size   16M;    

    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log             off;
    error_log              /dev/null;

    # SSL
    ssl_session_timeout    1d;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_tickets    off;

    # Diffie-Hellman parameter for DHE ciphersuites
    ssl_dhparam            /etc/nginx/dhparam.pem;

    # Mozilla Intermediate configuration
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # OCSP Stapling
    #ssl_stapling           on;
    #ssl_stapling_verify    on;
    resolver               1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220 valid=60s;
    resolver_timeout       2s;


    # Conexões/keepalive
    keepalive_timeout 65;
    keepalive_requests 10000;
    #sendfile on; tcp_nopush on; tcp_nodelay on;

    # Uploads (combine com PHP: 2G)
    client_max_body_size 2g;


    #gzip on;
    #gzip_types text/css application/javascript application/json image/svg+xml;
    #gzip_min_length 1024;

    upstream moodle_fpm {
        least_conn;
        server 10.100.200.3:9001 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9002 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9003 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9004 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9005 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9006 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9007 max_fails=3 fail_timeout=30s;
        server 10.100.200.3:9008 max_fails=3 fail_timeout=30s;
	keepalive 256;
    }

    server {
        listen 80;
        server_name campusvirtual2.com www.campusvirtual2.com;
    	
	location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
    	}
	
	location / {
	return 301 https://$host$request_uri;
        }  
    }

    server {
	listen 443 ssl ;
	#http2 on;
	server_name campusvirtual2.com www.campusvirtual2.com;

	ssl_certificate     /etc/letsencrypt/live/campusvirtual2.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/campusvirtual2.com/privkey.pem;

        # logging
    	access_log              /var/log/nginx/access.log combined buffer=512k flush=1m;
	error_log               /var/log/nginx/error.log warn;
	
	root /var/www/html;
        index index.php;

        location / {
	    try_files $uri $uri/ /index.php?$query_string;

        }

	#location ~ \.php(/|$) {
	location ~ [^/]\.php(/|$) {
            fastcgi_index index.php;
	    include fastcgi_params;
	    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
	    fastcgi_pass moodle_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	    fastcgi_param PATH_INFO $fastcgi_path_info;
	    # FORCE https dentro do PHP
	    fastcgi_param HTTP_X_FORWARDED_SCHEME https;
	    fastcgi_param HTTPS on;
	    fastcgi_param REQUEST_SCHEME https;
	    fastcgi_param X-Forwarded-Proto https;
	    fastcgi_param HTTP_X_FORWARDED_PROTO https;
	    fastcgi_param SERVER_PORT 443;

            fastcgi_keep_conn on;
	    fastcgi_connect_timeout 15s;
	    fastcgi_read_timeout    120s;
	    fastcgi_send_timeout    120s;
	    fastcgi_buffering on;
	    fastcgi_buffers 16 32k;
	    fastcgi_buffer_size 64k;
	    fastcgi_busy_buffers_size 256k;
	    fastcgi_temp_file_write_size 256k;

        }
    }
}

