  cron:
    image: campusvirtual_app-moodle-fpm01 
    container_name: ${DOMAIN:-campusvirtual.unb.br}_cron
    restart: unless-stopped
    volumes:
      - ./moodle_data/moodle:/var/www/html
      - ./moodledata_data:/var/www/moodledata
      - ./cron-logs/cron.log:/var/log/moodle_cron.log
    command: >
      sh -c "while true; do
        php /var/www/html/admin/cli/cron.php >> /var/log/moodle_cron.log 2>&1;
        sleep 60;
      done"
    depends_on:
      - moodle-fpm01

  moodle-backup:
    build:
      context: ./backup
    container_name: ${DOMAIN:-campusvirtual.unb.br}_backup
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_HOST=172.16.28.204          # ← aponta pro outro host
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/backup
      - ./moodle_data/moodle:/var/www/html:ro
      - ./moodledata_data:/var/www/moodledata:ro
