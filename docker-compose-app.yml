  # ==============================================================
  # NOVO STACK WEB ULTRA-RÁPIDO (3× PHP-FPM + Load Balancer)
  # ==============================================================
  moodle-fpm01:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    container_name: ${DOMAIN:-campusvirtual.unb.br}_fpm01
    restart: unless-stopped
    volumes:
      - ./moodle_data/moodle:/var/www/html
      - ./moodledata_data:/var/www/moodledata
      - ./php.ini:/usr/local/etc/php/conf.d/99-moodle.ini
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G

