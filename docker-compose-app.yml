  moodle-lb:
    image: nginx:alpine
    container_name: ${DOMAIN:-campusvirtual.unb.br}_lb
    restart: unless-stopped
    ulimits:
      nofile: 200000
    sysctls:
      net.core.somaxconn: 65535
    ports:
      - '80:80'
      - '9000:9000'
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
      - ./moodle_data/moodle:/var/www/html   # ← CÓDIGO DO MOODLE
    depends_on:
      - moodle-fpm01
      - moodle-fpm02
      - moodle-fpm03
      - moodle-fpm04
      - moodle-fpm05
      - moodle-fpm06
      - moodle-fpm07
      - moodle-fpm08
      - cron

    networks:
      - default

