  cron:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    container_name: ${DOMAIN:-campusvirtual2.com}_cron
    restart: unless-stopped
    volumes:
      - ./moodle_data/moodle:/var/www/html
      - ./moodledata_data:/var/www/moodledata
      - ./cron-logs/cron.log:/var/log/moodle_cron.log
    command: >
      sh -c "while true; do
        php /var/www/html/admin/cli/cron.php >> /var/log/moodle_cron.log 2>&1;
        sleep 60;
      done"
    depends_on:
      - moodle-fpm01

networks:
