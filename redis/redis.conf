##########################################
# Redis 8.4.0 – Configuração ideal Moodle
# Ambiente: Produção / Alta concorrência
##########################################

###############
# NETWORK
###############
bind 0.0.0.0
protected-mode no 
port 6379

# Senha obrigatória (troque!)
#requirepass MINHA_SENHA_FORTE_AQUI

# Específico para alta carga
tcp-backlog 2048
tcp-keepalive 300


###############
# MEMORY
###############
# Tamanho ideal para 300 – 2000 usuários simultâneos
maxmemory 2gb

# Melhor política para sessões do Moodle
maxmemory-policy allkeys-lru

# Algoritmo de eviction mais preciso
maxmemory-samples 10


###############
# LATÊNCIA / THREADS
###############
# Redis 8.x tem I/O threading muito mais eficiente
io-threads 4
io-threads-do-reads yes

# Evita stalls quando estoura conexão
client-output-buffer-limit normal 0 0 0


###############
# PERSISTÊNCIA (AOF 2.0)
###############
# AOF é mais seguro que RDB para sessões
appendonly yes
appendfilename "appendonly.aof"

# Novo modo de AOF 2.0 (compatível com Redis 8+)
aof-use-rdb-preamble yes

# Melhor equilíbrio entre segurança e performance
appendfsync everysec

# Evita explosão de disco
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb


###############
# PERFORMANCE PARA MOODLE
###############
# Evict lento + background: evita travar o PHP-FPM
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Evitar pausas com sessões grandes
activedefrag yes
active-defrag-cycle-min 1
active-defrag-cycle-max 25
active-defrag-ignore-bytes 100mb

# Não usar swap
no-appendfsync-on-rewrite yes


###############
# CACHE
###############
# Apenas 1 DB para Moodle
databases 1


###############
# LOGS
###############
loglevel notice

