services:
  moodledb:
    image: mariadb:latest
    container_name: ${DOMAIN}_db
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always
    env_file: .env
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DB}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
      - TZ=America/Sao_Paulo
    networks:
      - default

  moodlepgdb: # 🛠 Corrigido nome duplicado e conflito com mariadb/postgres
    image: postgres:13
    container_name: ${DOMAIN}_pgdb
    restart: always
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=America/Sao_Paulo
    networks:
      - default

  campusvirtual2.com:
    container_name: ${DOMAIN}_web
    env_file: .env
    build: .
    ports:
      - '8002:80'
    environment:
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=moodlepgdb
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_USER=${POSTGRES_USER}
      - MOODLE_DATABASE_NAME=${POSTGRES_DB}
      - MOODLE_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - ALLOW_EMPTY_PASSWORD=no
      - MOODLE_REVERSEPROXY=yes
      - TZ=America/Sao_Paulo
      - PINPOINT_COLLECTOR_HOST=pinpoint-collector # 🆕 Necessário para agente PHP localizar o collector
    volumes:
      - ./moodle_data:/var/www/html
      - ./moodledata_data:/var/www/moodledata
      - ./logs:/var/log/apache2
      - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
      - ./default-ssl.conf:/etc/apache2/sites-available/default-ssl.conf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - moodlepgdb
    extra_hosts:
      - "${DOMAIN}:127.0.1.1"
    networks:
      - rede_proxy_reverso
      - default

  cron:
    image: moodlehq/moodle-php-apache:8.1
    container_name: ${DOMAIN}_cron
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./moodle_data:/var/www/html
      - ./moodledata_data:/var/www/moodledata
    entrypoint: >
      /bin/sh -c "while true; do php /var/www/html/moodle/admin/cli/cron.php; sleep 60; done"
    depends_on:
      - campusvirtual2.com

  redis:
    image: redis:7.4.1-alpine
    volumes:
      - ./redis:/data
    ports:
      - 6379:6379
    networks:
      - default

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    environment:
      DB_MYSQL_HOST: moodledb
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm_user
      DB_MYSQL_PASSWORD: secure_npm_password
      DB_MYSQL_NAME: npm_database
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - rede_proxy_reverso
      - default

  pinpoint-hbase: # 🆕 Serviço HBase necessário para o funcionamento do Pinpoint
    image: pinpointdocker/pinpoint-hbase:2.5.2
    container_name: pinpoint-hbase
    ports:
      - "16010:16010"
      - "2181:2181"
      - "60000:60000"
      - "60010:60010"
    networks:
      - default

  pinpoint-collector: # ✅ Já estava, mas adicionamos dependência ao HBase
    image: pinpointdocker/pinpoint-collector:2.5.2
    container_name: pinpoint-collector
    depends_on:
      - pinpoint-hbase # 🆕 Necessário para aguardar o HBase subir
    environment:
      - HBASE_HOST=pinpoint-hbase # 🆕 Configuração do host HBase
    ports:
      - "9994:9994"
      - "9995:9995"
      - "9996:9996"
    networks:
      - rede_proxy_reverso
      - default

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:2.5.2
    container_name: pinpoint-web
    depends_on:
      - pinpoint-collector
    environment:
      - SPRING_PROFILES_ACTIVE=release
      - COLLECTOR_IP=pinpoint-collector
      - HBASE_HOST=pinpoint-hbase # 🆕 Garante conexão com HBase
    ports:
      - "28080:8080"
    volumes:
      - ./pinpoint-config/hbase/hbase-site.xml:/pinpoint/web/WEB-INF/classes/hbase-site.xml
    networks:
      - rede_proxy_reverso
      - default

volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local
  pg_data:
    driver: local

networks:
  default:
    name: rede_${DOMAIN}
  rede_proxy_reverso:
    name: rede_proxy_reverso_interna

