events {}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Proteção contra XSS e tentativas maliciosas
        location ~ "[<>]|\.\." {
            return 403;
        }

        # 🔐 Let's Encrypt (caso precise via NPM)
        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
            default_type "text/plain";
            try_files $uri =404;
        }

        # 🧩 HTML para iframes (libera geral)
        location ~* \.html$ {
            try_files $uri =404;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options "ALLOWALL";  # Libera para iframe em qualquer origem
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
        }

        # 🎥 Bloco para vídeos MP4 com proteção de referer
        location ~* \.mp4$ {
            root /usr/share/nginx/html;
            try_files $uri =404;

            add_header Content-Type video/mp4;
            add_header Access-Control-Allow-Origin *;
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 📁 Bloco padrão para outros arquivos (imagens, fontes, etc)
        location / {
            try_files $uri =404;

            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # X-Frame-Options é omitido aqui para permitir iframe dos HTMLs
        }
    }
}

