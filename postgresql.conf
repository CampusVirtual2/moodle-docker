# ================================================
# PostgreSQL 13 – Configuração otimizada para Moodle
# Servidor: 6 CPU, 16 GB RAM
# PgBouncer: transaction pooling
# ================================================

# CONEXÕES
listen_addresses = '*'
max_connections = 500            # PgBouncer faz o pooling → NÃO aumente isso
superuser_reserved_connections = 10

# MEMÓRIA
shared_buffers = 4GB             # 25% da RAM total → ideal para PostgreSQL
effective_cache_size = 12GB      # cache do SO + shared_buffers
work_mem = 64MB                  # seguro para 6 CPUs
maintenance_work_mem = 1GB       # acelera autovacuum
temp_buffers = 16MB

# WAL / CHECKPOINT
wal_level = replica
wal_buffers = 32MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# I/O (SSD/NVMe)
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# PARALELISMO (ajustado p/ 6 CPUs)
max_worker_processes = 6
max_parallel_workers = 6
max_parallel_workers_per_gather = 3
max_parallel_maintenance_workers = 3

# AUTOVACUUM (Moodle exige tuning agressivo)
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 20s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2500
autovacuum_freeze_max_age = 200000000
vacuum_cost_limit = 2000
vacuum_cost_delay = 2ms
parallel_leader_participation = on

# LOGS
log_min_duration_statement = 1000
log_checkpoints = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# REDE (ESSENCIAL p/ Moodle remoto)
tcp_keepalives_idle = 20
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# ESTABILIDADE
statement_timeout = 5min 
idle_in_transaction_session_timeout = 2min

# ESSENCIAL PARA MOODLE REMOTO + PGBOUNCER
synchronous_commit = off

