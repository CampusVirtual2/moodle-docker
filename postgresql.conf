# ==========================================
# PostgreSQL 13.x — tuning para Moodle em Docker
# Host: 10 vCPU / 32 GB RAM
# Meta: ~300-500 usuários simultâneos
# Usa ~16 GB de RAM (≈ 50% do host)
# ==========================================

listen_addresses = '*'
max_connections = 800             # suporta ~500 usuários Moodle
superuser_reserved_connections = 10

# ---- MEMÓRIA ----
shared_buffers = 8GB              # 25% da RAM total
effective_cache_size = 16GB       # cache de SO + shared_buffers
work_mem = 32MB                   # para ORDER BY / JOIN pesados
maintenance_work_mem = 1GB
temp_buffers = 16MB

# ---- WAL / CHECKPOINT ----
wal_buffers = 32MB
min_wal_size = 2GB
max_wal_size = 8GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ---- I/O / STORAGE ----
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 300
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# ---- AUTOVACUUM ----
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 3000
autovacuum_freeze_max_age = 200000000

# ---- LOGGING ----
log_min_duration_statement = 1000  # loga queries >1s
log_checkpoints = on
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_temp_files = 0
log_autovacuum_min_duration = 0

# ---- DEMAIS ----
default_statistics_target = 200
bgwriter_lru_maxpages = 200
bgwriter_lru_multiplier = 2.5

